[project]
name = "ismiseeanna-mcp"
version = "0.1.0"
description = "Local MCP server for querying Garmin Connect activities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0,<4",
    "garminconnect>=0.2.20,<0.3",
]

[project.scripts]
ismiseeanna-mcp = "ismiseeanna_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ismiseeanna_mcp"]
