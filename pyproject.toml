[project]
name = "ismiseeanna-mcp"
version = "0.1.0"
description = "Local MCP server for querying and creating Garmin Connect workouts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "garminconnect>=0.3.2,<0.4",
]

[project.scripts]
ismiseeanna-mcp = "ismiseeanna_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ismiseeanna_mcp"]
