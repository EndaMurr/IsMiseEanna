name: Deploy

# Fires only after CI has actually passed on the deploy branch - never in
# parallel with it, so a failing test or lint run can't get deployed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [claude/garmin-mcp-server-b3sj3m]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the OIDC token Workload Identity Federation exchanges below

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # No long-lived key: GitHub mints a short-lived OIDC token for this run,
      # which GCP exchanges for a token as ismiseeanna-deployer - but only if
      # the token's "repository" claim matches EndaMurr/IsMiseEanna (enforced
      # by the provider's attribute-condition, set up in the README).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/324206726205/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ismiseeanna-deployer@garmin-mcp-505007.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to ismiseeanna-mcp VM
        run: |
          gcloud compute ssh ismiseeanna-mcp \
            --zone=us-central1-a \
            --project=garmin-mcp-505007 \
            --tunnel-through-iap \
            --quiet \
            --command="
              sudo -u ismiseeanna git -C /opt/ismiseeanna-mcp pull &&
              sudo -u ismiseeanna git -C /opt/ismiseeanna-mcp log -1 --oneline &&
              cd /opt/ismiseeanna-mcp &&
              sudo /root/.local/bin/uv sync --frozen &&
              sudo chown -R ismiseeanna:ismiseeanna /opt/ismiseeanna-mcp/.venv &&
              sudo systemctl restart ismiseeanna-mcp.service &&
              sleep 3 &&
              sudo systemctl status ismiseeanna-mcp.service --no-pager -l &&
              sudo systemctl is-active --quiet ismiseeanna-mcp.service
            "

      - name: Show recent service logs (on failure)
        if: failure()
        run: |
          gcloud compute ssh ismiseeanna-mcp \
            --zone=us-central1-a \
            --project=garmin-mcp-505007 \
            --tunnel-through-iap \
            --quiet \
            --command="sudo journalctl -u ismiseeanna-mcp.service -n 50 --no-pager"
