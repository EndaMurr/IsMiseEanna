# Fly.io app config for the hosted IsMiseEanna MCP server.
#
# One-time setup (see README's "Hosted deployment" section for the full
# walkthrough, including the WorkOS AuthKit side):
#
#   fly launch --no-deploy          # creates the app, pick a name/region
#   fly volumes create data --size 1 --region <your-region>
#   fly secrets set \
#     WORKOS_AUTHKIT_DOMAIN=https://your-project-xxxxx.authkit.app \
#     MCP_RESOURCE_URL=https://<your-app>.fly.dev/mcp \
#     TOKEN_ENCRYPTION_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
#   fly deploy
#
# No GARMIN_EMAIL/GARMIN_PASSWORD here - every person who adds this
# connector (including you) connects their own Garmin account via the
# start_garmin_connection tool after logging in through claude.ai.

app = "ismiseeanna-mcp"   # change to your chosen app name
primary_region = "iad"    # change to whatever `fly platform regions` suggests as closest

[build]

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
